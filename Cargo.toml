[package]
name = "carisa-core"
description = ""
authors = ["David Suárez Pascual <dav.sua.pas@gmail.com>"]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/davsuapas/carisa"

[dependencies]
async-trait = "0.1.92"
derive_builder = "0.20.2"
futures-util = "0.3.34"
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager"] }
rig-core = "0.45.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"
url = "2.5.8"
zstd = "0.14.3"

[dev-dependencies]
redis-test = { version = "1.0.4", features = ["aio"] }
rstest = "0.28.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util"] }

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
warnings = { level = "deny" }
keyword_idents = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

# Individuales allow-by-default
missing_docs = { level = "deny" }
missing_debug_implementations = { level = "warn" }
unsafe_code = { level = "deny" }
unsafe_op_in_unsafe_fn = { level = "deny" }
unreachable_pub = { level = "warn" }
unnameable_types = { level = "warn" }
unused_lifetimes = { level = "warn" }
unused_import_braces = { level = "warn" }
unused_macro_rules = { level = "warn" }
redundant_lifetimes = { level = "warn" }
redundant_imports = { level = "warn" }
trivial_casts = { level = "warn" }
trivial_numeric_casts = { level = "warn" }
unit_bindings = { level = "warn" }
single_use_lifetimes = { level = "warn" }
explicit_outlives_requirements = { level = "warn" }

[lints.rustdoc]
broken_intra_doc_links = { level = "deny" }
private_intra_doc_links = { level = "deny" }
missing_crate_level_docs = { level = "deny" }
invalid_html_tags = { level = "deny" }
invalid_rust_codeblocks = { level = "deny" }
bare_urls = { level = "deny" }
unescaped_backticks = { level = "deny" }
redundant_explicit_links = { level = "deny" }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Restriction
unwrap_used = { level = "deny" }
expect_used = { level = "warn" }
panic = { level = "warn" }
todo = { level = "deny" }
unimplemented = { level = "deny" }
indexing_slicing = { level = "warn" }
dbg_macro = { level = "deny" }
print_stdout = { level = "warn" }
print_stderr = { level = "warn" }
clone_on_ref_ptr = { level = "warn" }
str_to_string = { level = "warn" }
undocumented_unsafe_blocks = { level = "deny" }
allow_attributes = { level = "warn" }
arithmetic_side_effects = { level = "warn" }
cast_possible_truncation = { level = "warn" }
cast_sign_loss = { level = "warn" }
else_if_without_else = { level = "warn" }
exhaustive_structs = { level = "warn" }
exhaustive_enums = { level = "warn" }
exit = { level = "deny" }
must_use_candidate = { level = "allow" }
